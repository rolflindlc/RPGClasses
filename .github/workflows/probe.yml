name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.modrinth.com/v2/project/epic-fight/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(v['version_number'], v['id'], v['date_published'][:10], [f['filename'] for f in v['files']]) for v in d[:10]]"
