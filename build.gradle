plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { name = "Iron's Maven - Release"; url = "https://code.redspace.io/releases" }
    maven { name = "Curios"; url = "https://maven.theillusivec4.top/" }
    maven { name = "JEI"; url = "https://maven.blamejared.com/" }
}

configurations {
    // Sonda: el jar completo de ISS solo para leer sus ids (no se compila contra él).
    issProbe { transitive = false }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}:api")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")

    issProbe "io.redspace:irons_spellbooks:${irons_spells_version}"

    // Las pruebas unitarias solo usan core/ (lógica pura).
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}

// Lista ids de ISS (ítems, entidades, tablas de botín, dependencias) para verificar datos del mod.
tasks.register('issProbe') {
    doLast {
        def jar = configurations.issProbe.singleFile
        def zf = new java.util.zip.ZipFile(jar)
        def out = new StringBuilder()
        def toml = zf.getEntry('META-INF/mods.toml')
        if (toml != null) out.append("=== mods.toml ===\n").append(zf.getInputStream(toml).text).append('\n')
        def lang = zf.getEntry('assets/irons_spellbooks/lang/en_us.json')
        if (lang != null) {
            def json = new groovy.json.JsonSlurper().parse(zf.getInputStream(lang))
            out.append("=== items/entities ===\n")
            json.keySet().findAll { it.startsWith('item.irons_spellbooks.') || it.startsWith('entity.irons_spellbooks.') }
                    .findAll { it.split('\\.').length == 3 }
                    .sort().each { out.append(it).append(" = ").append(json[it]).append('\n') }
        }
        out.append("=== loot tables (chests) ===\n")
        zf.entries().each { e ->
            if (e.name.startsWith('data/irons_spellbooks/loot_tables/chests/') && e.name.endsWith('.json')) out.append(e.name).append('\n')
        }
        zf.close()
        def f = file("$buildDir/iss_probe.txt")
        f.parentFile.mkdirs()
        f.text = out.toString()
        println out.toString()
    }
}

processResources {
    def replaceProperties = [
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            irons_spells_version_range: irons_spells_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
