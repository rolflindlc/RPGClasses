[[mods]]
modId="rpgclasses"
version="${file.jarVersion}"
displayName="RPG Classes"
authors="Rolflin"
credits="Textures and art by their respective artists. Built for Minecraft Forge 1.20.1."
description='''A balanced class and race system for Minecraft, defined entirely by datapacks.
Pick a race and a class, grow through branches and subclasses, complete race rites, and fight with class abilities.
Integrates with Iron's Spells 'n Spellbooks and Epic Fight (both optional). Available in 15 languages.'''

[[dependencies.rpgclasses]]
    modId="forge"
    mandatory=true
    versionRange="[47.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rpgclasses]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Fase 4: pasar a mandatory=true cuando el código use sus puentes.
[[dependencies.rpgclasses]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="[1.20.1-3.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.rpgclasses]]
    modId="epicfight"
    mandatory=false
    versionRange="[20,)"
    ordering="AFTER"
    side="BOTH"
